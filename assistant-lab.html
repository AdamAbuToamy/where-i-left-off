<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WILO Local Model Lab</title><style>body{font:16px system-ui;max-width:840px;margin:4rem auto;padding:1rem;background:#f5f5ed;color:#25342e}main{background:#fff;padding:2rem;border-radius:22px;box-shadow:0 12px 35px #0001}button,select,input{font:inherit;padding:.7rem;border-radius:10px;margin:.3rem}button{background:#365c4b;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}progress{width:100%;height:14px}pre{overflow:auto;white-space:pre-wrap;background:#edf1e8;padding:1rem;border-radius:10px}p{line-height:1.6}</style></head><body><main><h1>WILO — Local Model Lab</h1><p>Development only. Real WebGPU inference with synthetic records; no Firebase account or writes. Model files may require a large initial download.</p><label>Suite <select id="suite"><option value="smoke">Smoke (3)</option><option value="original" selected>Original 618</option><option value="stress-ar">Arabic 2000</option><option value="stress-en">English 2000</option><option value="stress-he">Hebrew 2000</option></select></label><label>Max cases <input type="number" id="limit" min="1" max="2000" value="618"></label><p><button id="load">Load local model</button><button id="run" disabled>Run real tests</button><button id="stop" disabled>Stop after current test</button><button id="export">Export results</button></p><p id="state" role="status">Not loaded</p><progress id="progress" value="0" max="1"></progress><pre id="stats"></pre><pre id="failures"></pre></main><script type="module" src="/src/assistant/localLab.ts"></script></body></html>
