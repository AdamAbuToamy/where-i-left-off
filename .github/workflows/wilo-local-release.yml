name: WILO local release verification
on:
  push:
    branches: [fix/wilo-local-release-20261025]
permissions:
  contents: read
concurrency:
  group: wilo-local-release
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Package dependencies without credentials or environment files
        run: tar -czf /tmp/wilo-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: wilo-deps
          path: /tmp/wilo-deps.tar.gz
          retention-days: 1
      - run: npm run lint
      - run: VITE_USE_EMULATORS=false npm run build
      - run: npm test
