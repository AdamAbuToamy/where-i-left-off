name: WILO local code verification
on:
  push:
    branches: [fix/wilo-local-release-20261025]
    paths-ignore: ['docs/**', '.github/workflows/wilo-local-release.yml']
permissions:
  contents: read
concurrency:
  group: wilo-local-code
  cancel-in-progress: true
jobs:
  code-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci --no-audit --no-fund
      - run: npm run lint
      - run: VITE_USE_EMULATORS=false npm run build
      - run: npm test
      - name: Identify scope of evidence
        run: echo 'These are code checks, not 618 live model passes. Production deployment requires scripts/test-assistant-browser.mjs --limit=618 --resume --persist --deploy on a supported adapter.'
