name: Account deletion worker
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-deletion-worker
  cancel-in-progress: false
jobs:
  delete-expired-accounts:
    if: ${{ vars.ACCOUNT_DELETION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete confirmed deletion requests older than 24 hours
        run: node scripts/process-account-deletions.mjs --execute
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'where-i-left-off-b5683' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
