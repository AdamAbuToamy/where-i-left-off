name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  unit-and-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix push-worker --no-audit --no-fund
      - name: Test Worker and package
        run: |
          npm test --prefix push-worker
          npm exec --prefix push-worker -- wrangler deploy --config push-worker/wrangler.jsonc --dry-run --outdir /tmp/wilo-push-check
      - run: npm run check:credentials
      - run: npm run lint
      - run: VITE_USE_EMULATORS=false npm run build
      - run: npm test
  firebase-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix push-worker --no-audit --no-fund
      - run: npm run test:rules
  auth-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:auth:recovery
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Restore only failed browser case IDs on a retry
        if: github.run_attempt != '1'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: browser-failure-state
          path: test-results/
      - name: Run browser cases against local emulators
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != '1' ] && [ -f test-results/.last-run.json ]; then
            npm run test:e2e:failed
          else
            npm run test:e2e
          fi
      - name: Keep failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          overwrite: true
          retention-days: 7
      - name: Keep failed case IDs without credentials
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-state
          path: test-results/.last-run.json
          include-hidden-files: true
          overwrite: true
          retention-days: 7
      - name: Keep interface review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-review
          path: test-results/layout-review/
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
