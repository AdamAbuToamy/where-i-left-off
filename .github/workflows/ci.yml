name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run Firestore rules tests in emulator
        run: npm run test:rules

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against Firebase emulators
        run: npm run test:e2e
