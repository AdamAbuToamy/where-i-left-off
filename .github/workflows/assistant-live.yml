name: Assistant live validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/assistant-live.yml', 'scripts/test-assistant-live.mjs', 'scripts/check-gemini-catalog.mjs', 'push-worker/src/assistant*.mjs', 'shared/assistantDialogue.mjs', 'scripts/test-assistant-dialogue.mjs', '.github/assistant-test-request.json']
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [gemini, groq]
        default: gemini
        required: true
      scope:
        description: 'Smoke tests use 3 synthetic prompts; the full suite uses the provider allowance.'
        type: choice
        options: [smoke, full]
        default: smoke
        required: true
      case_id:
        description: 'Optional exact case ID; runs only that request.'
        type: string
        default: ''
      confirm_free_project:
        description: 'I confirm this key belongs to a free project with no paid billing enabled.'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: assistant-live-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check readiness without exposing the key or invoking AI
        id: readiness
        env:
          PROVIDER: ${{ inputs.provider || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_REQUEST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[assistant-test-request]') }}
          FREE_CONFIRMED: ${{ inputs.confirm_free_project }}
          FREE_CANARY: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[assistant-dialogue-canary]') || contains(github.event.head_commit.message, '[gemini-free-canary]') || contains(github.event.head_commit.message, '[gemini-free-acceptance]') || contains(github.event.head_commit.message, '[gemini-free-case:')) }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync,writeFileSync,readFileSync} from 'node:fs';
          import {assistantTestRequest} from './scripts/lib/assistantTestRequest.mjs';
          const requested=process.env.TEST_REQUEST==='true'?assistantTestRequest(JSON.parse(readFileSync('.github/assistant-test-request.json','utf8'))):null;
          const provider=process.env.PROVIDER;
          if(!['gemini','groq'].includes(provider))throw new Error('Invalid provider.');
          const present=Boolean(process.env[provider==='gemini'?'GEMINI_API_KEY':'GROQ_API_KEY']?.trim());
          // Bounded repair canary authorized by the owner's free-project confirmation in run 40089379901.
          const canary=(process.env.FREE_CANARY==='true'||requested!==null)&&provider==='gemini';
          const ready=present&&(canary||(process.env.EVENT_NAME==='workflow_dispatch'&&process.env.FREE_CONFIRMED==='true'));
          const reason=!present?provider+'-key-required':process.env.EVENT_NAME!=='workflow_dispatch'?'manual-run-required':process.env.FREE_CONFIRMED!=='true'?'free-project-confirmation-required':'ready';
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if(!ready){
            writeFileSync('assistant-acceptance-live-report.json',JSON.stringify({status:'not-run',reason,provider,inferenceRequests:0,productionWrites:0},null,2));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,'No live inference ran. Reason: '+reason+'. A green readiness job is not an AI test pass.\n');
            if(process.env.EVENT_NAME==='workflow_dispatch'||process.env.FREE_CANARY==='true')process.exitCode=1;
          }
          JS
      - name: Install the synthetic test harness
        if: steps.readiness.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
      - name: Run actual model inference with synthetic account data
        if: steps.readiness.outputs.ready == 'true'
        env:
          PROVIDER: ${{ inputs.provider || 'gemini' }}
          TEST_SCOPE: ${{ inputs.scope }}
          REPAIR_COMMIT: ${{ github.event.head_commit.message }}
          TEST_REQUEST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[assistant-test-request]') }}
          FREE_ACCEPTANCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gemini-free-acceptance]') }}
          CASE_ID: ${{ inputs.case_id }}
          FREE_CANARY: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[assistant-dialogue-canary]') || contains(github.event.head_commit.message, '[gemini-free-canary]') || contains(github.event.head_commit.message, '[gemini-free-acceptance]') || contains(github.event.head_commit.message, '[gemini-free-case:')) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {assistantTestRequest} from './scripts/lib/assistantTestRequest.mjs';
          if(process.env.REPAIR_COMMIT?.includes('[assistant-dialogue-canary]')){
            const dialogue=spawnSync(process.execPath,['scripts/test-assistant-dialogue.mjs'],{stdio:'inherit',env:process.env});
            process.exit(dialogue.status??1);
          }
          if(process.env.PROVIDER==='gemini'&&process.env.FREE_CANARY==='true'){
            const catalog=spawnSync(process.execPath,['scripts/check-gemini-catalog.mjs'],{stdio:'inherit',env:process.env});
            if(catalog.status!==0)process.exit(catalog.status??1);
          }
          const args=['scripts/test-assistant-live.mjs','--live','--provider='+process.env.PROVIDER];
          const repairCase=process.env.REPAIR_COMMIT?.match(/\[gemini-free-case:([-a-z0-9]+)\]/)?.[1];
          if(process.env.TEST_REQUEST==='true')args.push(...assistantTestRequest(JSON.parse(readFileSync('.github/assistant-test-request.json','utf8'))).args);
          else if(repairCase)args.push('--case='+repairCase,'--stop-on-failure');
          else if(process.env.FREE_ACCEPTANCE==='true')args.push('--sample=200','--stop-on-failure');
          else if(process.env.FREE_CANARY==='true')args.push('--case=compound-card-ar','--case=compound-card-en','--case=compound-card-he','--stop-on-failure');
          else if(process.env.CASE_ID)args.push('--case='+process.env.CASE_ID);
          else if(process.env.TEST_SCOPE==='smoke')args.push('--case=compound-card-ar','--case=compound-card-en','--case=compound-card-he');
          const r=spawnSync(process.execPath,args,{stdio:'inherit',env:process.env});
          process.exitCode=r.status??1;
          JS
      - name: Select successful live replies for persistence even after a later case fails
        if: always() && steps.readiness.outputs.ready == 'true'
        id: replay
        run: |
          node --input-type=module <<'JS'
          import {existsSync,readFileSync,appendFileSync} from 'node:fs';
          const path='assistant-acceptance-live-report.json';
          const report=existsSync(path)?JSON.parse(readFileSync(path,'utf8')):null;
          const count=report?.kind==='live-provider-synthetic-data'?report.results.filter(r=>r.status==='passed'&&typeof r.reply==='string').length:0;
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+(count>0)+'\n');
          JS
      - name: Prepare Java for local Firestore only
        if: always() && steps.replay.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply the actual model replies to Firestore emulator and reread
        if: always() && steps.replay.outputs.ready == 'true'
        id: persistence
        env:
          ASSISTANT_LIVE_REPORT: assistant-acceptance-live-report.json
        run: npx firebase emulators:exec --project demo-where-i-left-off --only firestore "env TEST_SUITE=security npx vitest run tests/assistantCorpusSecurity.test.ts"
      - name: Record the independently verified persistence stage
        if: always() && steps.replay.outputs.ready == 'true'
        env:
          PERSISTENCE_OUTCOME: ${{ steps.persistence.outcome }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='assistant-acceptance-live-report.json',report=JSON.parse(readFileSync(path,'utf8'));
          const passed=process.env.PERSISTENCE_OUTCOME==='success';
          report.persistence={status:passed?'passed':'failed',caseIds:passed?report.results.filter(r=>r.status==='passed').map(r=>r.id):[],productionWrites:0,firestoreMutationsOnly:true};
          writeFileSync(path,JSON.stringify(report,null,2)+'\n');
          JS
      - name: Keep the result including blocked or partial runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-live-report
          path: |
            assistant-acceptance-live-report.json
            gemini-catalog-report.json
          if-no-files-found: error
          retention-days: 7
