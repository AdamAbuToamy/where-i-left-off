name: Deploy Firebase Hosting
# All verified users connect their own Pollinations account; hosting never deploys a shared AI key.
on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]
  workflow_dispatch:
  workflow_call:
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: firebase-production-hosting
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Refuse superseded deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json'}});
          if(!r.ok||(await r.json()).object.sha!==process.env.DEPLOY_SHA)throw new Error('Refusing to deploy a superseded or non-main commit.');
          JS
      - name: Require successful quality checks for manual releases
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          if(process.env.TRIGGER_EVENT!=='workflow_run'){
            const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs?head_sha='+process.env.DEPLOY_SHA+'&per_page=50',{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'}});
            if(!r.ok||!(await r.json()).workflow_runs.some(run=>run.name==='Quality checks'&&run.conclusion==='success'))throw new Error('Current commit must pass Quality checks before production deployment.');
          }
          JS
      - name: Require requested dialogue canary before deploying its behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          if(execFileSync('git',['log','-1','--format=%B'],{encoding:'utf8'}).includes('[assistant-dialogue-canary]')){
            const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs?head_sha=${process.env.DEPLOY_SHA}&per_page=30`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json'}});
            if(!r.ok)throw new Error('Cannot verify the requested live dialogue canary.');
            const runs=(await r.json()).workflow_runs.filter(run=>run.name==='Assistant live validation');
            if(!runs.some(run=>run.conclusion==='success'))throw new Error('Live dialogue canary has not passed; existing site was not changed.');
          }
          JS
      - name: Check existing deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT is not configured. Add a Firebase Hosting deployment credential in repository secrets.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci --no-audit --no-fund
      - name: Preserve public production configuration and App Check
        run: node scripts/prepare-hosting-config.mjs
      - name: Diagnose public Auth origins without administrative permissions
        continue-on-error: true
        run: node scripts/diagnose-auth.mjs
      - name: Check and repair only the same-project Auth handler referrer
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/repair-auth-origin.mjs --fix
      - name: Keep safe Auth diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-origin-report
          path: |
            auth-origin-report.json
            auth-browser-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build production application
        run: |
          npm run check:architecture
          npm run build
          node scripts/generate-cloud-release.mjs
          node scripts/generate-sw.mjs
      - name: Run unit tests
        run: npm test
      - name: Deploy existing production hosting target only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: where-i-left-off-b5683
          channelId: live
          target: production
          # Hosting-only compatibility pin: 15.34 requires additional Service Usage IAM access.
          # Keep the existing least-privilege Hosting account; development CLI stays current.
          firebaseToolsVersion: 15.33.0
      - name: Remove temporary public configuration
        if: always()
        run: rm -f .env.production.local
