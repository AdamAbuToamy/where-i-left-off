name: Deploy Firebase Hosting
# Production assistant pilot is restricted to the verified owner in the client and Worker.
on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-production-hosting
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Refuse superseded deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json'}});
          if(!r.ok||(await r.json()).object.sha!==process.env.DEPLOY_SHA)throw new Error('Refusing to deploy a superseded or non-main commit.');
          JS
      - name: Check existing deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT is not configured. Add a Firebase Hosting deployment credential in repository secrets.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check owner pilot deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_CONFIG: ${{ secrets.CLOUDFLARE_WORKER_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const required=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_WORKER_CONFIG','GEMINI_API_KEY'];
          const missing=required.filter(name=>!process.env[name]?.trim());
          if(missing.length)throw new Error('Missing repository secrets: '+missing.join(', ')+'. Existing production site was not changed.');
          JS
      - name: Install existing Worker dependencies
        run: npm ci --prefix push-worker --no-audit --no-fund
      - name: Deploy Gemini pilot restricted to the verified owner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_CONFIG: ${{ secrets.CLOUDFLARE_WORKER_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/deploy-assistant-pilot.mjs
      - name: Verify deployed Worker protocol and CORS
        run: node scripts/check-assistant-deployment.mjs
      - name: Preserve public production configuration and App Check
        run: node scripts/prepare-hosting-config.mjs
      - name: Diagnose public Auth origins without administrative permissions
        continue-on-error: true
        run: node scripts/diagnose-auth.mjs
      - name: Check and repair only the same-project Auth handler referrer
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/repair-auth-origin.mjs --fix
      - name: Keep safe Auth diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-origin-report
          path: |
            auth-origin-report.json
            auth-browser-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build production application
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Deploy existing production hosting target only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: where-i-left-off-b5683
          channelId: live
          target: production
          firebaseToolsVersion: 15.33.0
      - name: Remove temporary public configuration
        if: always()
        run: rm -f .env.production.local
